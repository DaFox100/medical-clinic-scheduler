spring.application.name=TermProj_172

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medical_clinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Los_Angeles}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.error.include-message=always

# Enable only once when adopting the existing Hibernate-created development schema.
spring.flyway.baseline-on-migrate=${DB_BASELINE:false}
spring.flyway.baseline-version=0
app.notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080}
app.notification.worker-enabled=true
app.notification.poll-delay-ms=2000
app.notification.retry-seconds=5
